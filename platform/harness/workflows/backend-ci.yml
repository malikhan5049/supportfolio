name: Backend CI

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the backend service project'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend service
        run: ./gradlew -p ${{ inputs.project-path }} build
