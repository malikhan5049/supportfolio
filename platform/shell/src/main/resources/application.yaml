server:
  port: 8080

supportfolio:
  shell:
    identity-uri: ${SUPPORTFOLIO_SHELL_IDENTITY_URI:http://localhost:8081}
    remote-registry-file: ${SUPPORTFOLIO_SHELL_REMOTE_REGISTRY_FILE:platform/shell/config/remote-registry.json}
    trusted-remote-origins: ${SUPPORTFOLIO_SHELL_TRUSTED_REMOTE_ORIGINS:http://localhost:4201}
  security:
    resource-server:
      enabled: true
    jwk-set-uri: ${SUPPORTFOLIO_SHELL_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
    issuer-uri: ${SUPPORTFOLIO_SHELL_ISSUER_URI:http://localhost:8081}
    permit-paths: /,/index.html,/signin,/auth/callback,/api/remote-registry,/api/token,/auth/login,/oauth2/**,/login/**,/assets/**,/*.js,/*.css,/*.ico
    csrf-ignore-paths: /api/token

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-token
              uri: ${supportfolio.shell.identity-uri}
              predicates:
                - Path=/api/token
            - id: identity-login-start
              uri: ${supportfolio.shell.identity-uri}
              predicates:
                - Path=/auth/login
            - id: identity-oauth
              uri: ${supportfolio.shell.identity-uri}
              predicates:
                - Path=/oauth2/**,/login/**
