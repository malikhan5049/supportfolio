server:
  port: 8081

# Identity properties are intentionally absent here (no secrets in version control)
# but are required at runtime — the beans in later tasks fail fast when they are
# missing. Supply them via environment variables. Property name -> env-var
# substitution used by later tasks:
#
#   supportfolio.identity.issuer                 -> SUPPORTFOLIO_IDENTITY_ISSUER
#   supportfolio.identity.admin-login            -> SUPPORTFOLIO_IDENTITY_ADMIN_LOGIN
#   supportfolio.identity.allowlist              -> SUPPORTFOLIO_IDENTITY_ALLOWLIST
#   supportfolio.identity.redirect-origins       -> SUPPORTFOLIO_IDENTITY_REDIRECT_ORIGINS
#   supportfolio.identity.jwt-private-key-pem    -> SUPPORTFOLIO_IDENTITY_JWT_PRIVATE_KEY_PEM
#   spring.security.oauth2.client.registration.github.client-id     -> GITHUB_CLIENT_ID
#   spring.security.oauth2.client.registration.github.client-secret -> GITHUB_CLIENT_SECRET
#   spring.security.oauth2.client.provider.github.user-info-uri base -> SUPPORTFOLIO_IDENTITY_GITHUB_API_BASE_URL

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
        provider:
          github:
            user-info-uri: ${SUPPORTFOLIO_IDENTITY_GITHUB_API_BASE_URL:https://github.com}/user # base overridden in tests

# Actuator lives on a dedicated management port (all endpoints, health included).
# The management context is intentionally UNAUTHENTICATED by design: the browser chain excludes
# it via securityMatcher(...), not via permits; the port is never published by docker-compose and
# never proxied by the shell or the Cloudflare tunnel.
management:
  server:
    port: ${SUPPORTFOLIO_IDENTITY_MANAGEMENT_PORT:9092}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: identity
