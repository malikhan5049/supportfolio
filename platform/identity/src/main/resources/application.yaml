server:
  port: 8081

# Identity properties are intentionally absent here (no secrets in version control)
# but are required at runtime — the beans in later tasks fail fast when they are
# missing. Supply them via environment variables. Property name -> env-var
# substitution used by later tasks:
#
#   supportfolio.identity.issuer                 -> SUPPORTFOLIO_IDENTITY_ISSUER
#   supportfolio.identity.admin-login            -> SUPPORTFOLIO_IDENTITY_ADMIN_LOGIN
#   supportfolio.identity.allowlist              -> SUPPORTFOLIO_IDENTITY_ALLOWLIST
#   supportfolio.identity.redirect-origins       -> SUPPORTFOLIO_IDENTITY_REDIRECT_ORIGINS
#   supportfolio.identity.jwt-private-key-pem    -> SUPPORTFOLIO_IDENTITY_JWT_PRIVATE_KEY_PEM
#   spring.security.oauth2.client.registration.github.client-id     -> GITHUB_CLIENT_ID
#   spring.security.oauth2.client.registration.github.client-secret -> GITHUB_CLIENT_SECRET
