name: Platform CI

on:
  push:
  pull_request:

jobs:
  platform-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test platform modules
        run: ./gradlew build

      - name: Test build-logic
        run: ./gradlew -p build-logic test
