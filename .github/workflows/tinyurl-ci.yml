name: TinyURL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tinyurl-backend:
    name: tinyurl-backend
    uses: ./.github/workflows/backend-ci.yml
    with:
      project-path: projects/tinyurl/service
      gradle-module: projects:tinyurl:service

  tinyurl-frontend:
    name: tinyurl-frontend
    uses: ./.github/workflows/frontend-ci.yml
    with:
      project-name: tinyurl-microfrontend

  tinyurl-image:
    name: tinyurl-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: |
          ./gradlew :projects:tinyurl:service:bootJar
          npm ci
          npx nx build tinyurl-microfrontend
          npx tsx tools/prod-bundle-gate.ts dist/projects/tinyurl/microfrontend

      - name: Build a local amd64 image
        run: docker build --platform linux/amd64 -f projects/tinyurl/Dockerfile -t tinyurl:ci .

  demo-stack:
    name: demo-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build application jars and frontends
        run: |
          npm ci
          ./gradlew :platform:identity:bootJar :platform:shell:bootJar :projects:tinyurl:service:bootJar
          npx nx build shell-host
          npx nx build tinyurl-microfrontend
          npx tsx tools/prod-bundle-gate.ts dist/platform/shell/host dist/projects/tinyurl/microfrontend

      - name: Build demo images
        run: |
          docker build -f platform/identity/Dockerfile -t supportfolio/identity:demo .
          docker build -f platform/shell/Dockerfile -t supportfolio/shell:demo .

      # CI has no gitignored JWT key (platform/identity/.gitignore ignores *.pem), so Docker
      # would otherwise create an empty directory at the bind-mount path and identity would
      # fail with "could not be read / Is a directory". Mirror what scripts/demo.ps1 does.
      - name: Generate ephemeral demo JWT key
        run: |
          openssl genpkey -algorithm RSA -out platform/identity/dev-key.pem -pkeyopt rsa_keygen_bits:2048

      - name: Start the demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build --wait

      - name: Install Chromium and run the demo login flow
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --config=projects/tinyurl/ci/playwright.demo.config.ts

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=200

      - name: Tear the demo stack down
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v --remove-orphans

  observability:
    name: observability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build application jars and frontends
        run: |
          npm ci
          ./gradlew :platform:identity:bootJar :platform:shell:bootJar :projects:tinyurl:service:bootJar
          npx nx build shell-host
          npx nx build tinyurl-microfrontend

      # Same reason as demo-stack: CI has no gitignored JWT key, so Docker would create an
      # empty directory at the bind-mount path and identity would fail to boot.
      - name: Generate ephemeral demo JWT key
        run: |
          openssl genpkey -algorithm RSA -out platform/identity/dev-key.pem -pkeyopt rsa_keygen_bits:2048

      - name: Build demo images
        run: |
          docker build -f platform/identity/Dockerfile -t supportfolio/identity:demo .
          docker build -f platform/shell/Dockerfile -t supportfolio/shell:demo .

      - name: Boot observability profile
        run: docker compose -f docker-compose.demo.yml --profile observability up -d --build --wait

      - name: Assert all scrape targets are up
        run: |
          for i in $(seq 1 30); do
            targets=$(curl -fsS http://127.0.0.1:19090/api/v1/targets || true)
            healthy=$(echo "$targets" | jq -r '[.data.activeTargets[] | select(.labels.job | startswith("supportfolio-")) | .health] | unique | join(",")')
            count=$(echo "$targets" | jq -r '[.data.activeTargets[] | select(.labels.job | startswith("supportfolio-"))] | length')
            if [ "$healthy" = "up" ] && [ "$count" = "3" ]; then
              echo "all three targets up"
              exit 0
            fi
            echo "attempt $i: health=$healthy count=$count"
            sleep 5
          done
          echo "::error::Prometheus scrape targets did not converge to 3x up"
          docker compose -f docker-compose.demo.yml logs --tail=200
          exit 1

      - name: Assert grafana is serving the dashboard
        run: |
          curl -fsS http://127.0.0.1:13000/api/health
          curl -fsS "http://127.0.0.1:13000/api/search?query=Supportfolio" | grep -q supportfolio-services

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.demo.yml --profile observability down -v --remove-orphans
