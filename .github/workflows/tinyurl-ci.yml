name: TinyURL CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tinyurl-backend:
    name: tinyurl-backend
    uses: ./.github/workflows/backend-ci.yml
    with:
      project-path: projects/tinyurl/service
      gradle-module: projects:tinyurl:service

  tinyurl-frontend:
    name: tinyurl-frontend
    uses: ./.github/workflows/frontend-ci.yml
    with:
      project-name: tinyurl-microfrontend

  tinyurl-image:
    name: tinyurl-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: |
          ./gradlew :projects:tinyurl:service:bootJar
          npm ci
          npx nx build tinyurl-microfrontend
          npx tsx tools/prod-bundle-gate.ts dist/projects/tinyurl/microfrontend

      - name: Build a local amd64 image
        run: docker build --platform linux/amd64 -f projects/tinyurl/Dockerfile -t tinyurl:ci .

  demo-stack:
    name: demo-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEMO_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build application jars and frontends
        run: |
          npm ci
          ./gradlew :platform:identity:bootJar :platform:shell:bootJar :projects:tinyurl:service:bootJar
          npx nx build shell-host
          npx nx build tinyurl-microfrontend
          npx tsx tools/prod-bundle-gate.ts dist/platform/shell/host dist/projects/tinyurl/microfrontend

      - name: Build demo images
        run: |
          docker build -f platform/identity/Dockerfile -t supportfolio/identity:demo .
          docker build -f platform/shell/Dockerfile -t supportfolio/shell:demo .

      - name: Start the demo stack
        run: docker compose -f docker-compose.demo.yml up -d --build --wait

      - name: Install Chromium and run the demo login flow
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --config=projects/tinyurl/ci/playwright.demo.config.ts

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=200

      - name: Tear the demo stack down
        if: always()
        run: docker compose -f docker-compose.demo.yml down -v --remove-orphans
