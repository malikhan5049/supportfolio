name: Validate project manifests

on:
  push:
  pull_request:

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate all project manifests
        run: npx tsx tools/validate-all-manifests.ts projects --fail-on-invalid
