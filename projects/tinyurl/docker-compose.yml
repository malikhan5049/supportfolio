# Local development database only; these credentials are bound to localhost.
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: tinyurl
      POSTGRES_USER: tinyurl
      POSTGRES_PASSWORD: tinyurl
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tinyurl-pgdata:/var/lib/postgresql

volumes:
  tinyurl-pgdata: