server:
  port: 8082

supportfolio:
  security:
    resource-server:
      enabled: true
    jwk-set-uri: ${SUPPORTFOLIO_TINYURL_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
    issuer-uri: ${SUPPORTFOLIO_TINYURL_ISSUER_URI:http://localhost:8081}
    permit-paths: /actuator/health,/actuator/health/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/go/**
    permit-get-paths: /api/links
    csrf-ignore-paths: /api/token,/api/links

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tinyurl
    username: ${SUPPORTFOLIO_TINYURL_DB_USER:tinyurl}
    password: ${SUPPORTFOLIO_TINYURL_DB_PASSWORD:tinyurl}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
