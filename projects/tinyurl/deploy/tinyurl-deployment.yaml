apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyurl
  namespace: tinyurl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyurl
  template:
    metadata:
      labels:
        app: tinyurl
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: tinyurl
          image: ${TINYURL_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/${TINYURL_DB_NAME}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tinyurl-postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tinyurl-postgres
                  key: POSTGRES_PASSWORD
            - name: SUPPORTFOLIO_TINYURL_JWK_SET_URI
              value: ${TINYURL_IDENTITY_JWK_SET_URI}
            - name: SUPPORTFOLIO_TINYURL_ISSUER_URI
              value: ${TINYURL_IDENTITY_ISSUER_URI}
            - name: SUPPORTFOLIO_TINYURL_IDENTITY_URI
              value: ${TINYURL_IDENTITY_URI}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
