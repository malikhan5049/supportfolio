apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinyurl
  namespace: tinyurl
spec:
  rules:
    - host: tinyurl.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tinyurl
                port:
                  number: 8082
